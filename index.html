<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Awareness</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header class="navbar">
    <div class="logo">
      <div class="logo-icon">◉</div>
      <div class="logo-text">
        <span>AI</span>
        <span>AWARENESS</span>
      </div>
    </div>

    <nav>
      <a href="#">Home</a>
      <a href="#">About AI</a>
      <a href="#">Community</a>
      <a href="#">Safety</a>
      <a href="#">Quiz</a>
      <a href="#">Resources</a>
    </nav>

    <div class="nav-actions">
      <button class="search-btn">⌕</button>
      <button class="menu-btn">☰</button>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="hero-text">
        <h1>
          AI IS ALL<br />
          AROUND US.
        </h1>

        <div class="underline"></div>

        <p>
          Learn, explore and stay informed about Artificial Intelligence
          and how it impacts your everyday life.
        </p>

        <button class="primary-btn">GET STARTED →</button>
      </div>

      <div class="hero-image">
        <div class="floating-icon icon-one">💬</div>
        <div class="floating-icon icon-two">📱</div>
        <div class="floating-icon icon-three">📡</div>
        <div class="floating-icon icon-four">🚗</div>
        <div class="floating-icon icon-five">❤</div>

        <div class="robot">
          <div class="antenna"></div>

          <div class="robot-head">
            <div class="robot-face">
              <span class="eye"></span>
              <span class="eye"></span>
            </div>
          </div>

          <div class="robot-body"></div>
        </div>
      </div>
    </section>
  </main>

</body>
</html>
